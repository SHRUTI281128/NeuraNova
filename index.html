<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuraNova — Sherlock Code Inspector</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased" x-data="appData()" x-init="initApp()">

    <!-- Header Navigation -->
    <header class="border-b border-slate-200 bg-white/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-indigo-100 border border-indigo-200 flex items-center justify-center font-bold text-indigo-600 shadow-sm">
                    🔍
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 leading-tight">NeuraNova</h1>
                    <p class="text-xs text-slate-500">Automated Dead Code Analysis & Evaluation Parameters</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- Live Status Badge -->
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium border"
                      :class="apiConnected ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200'">
                    <span class="w-2 h-2 rounded-full mr-2" :class="apiConnected ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'"></span>
                    <span x-text="apiConnected ? 'API Connected' : 'API Disconnected'"></span>
                </span>
                
                <button @click="resetWorkspace()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md border border-slate-200 transition">
                    Clear Workspace
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Sidebar / Input Section -->
        <section class="lg:col-span-5 space-y-6">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <h2 class="text-md font-bold text-slate-900 mb-4 flex items-center">
                    <span class="mr-2 text-rose-500">🎯</span> Target Specification
                </h2>

                <!-- Failed to Fetch Alert Banner (Auto-switches to Offline Mode) -->
                <div x-show="!apiConnected" x-transition class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl flex items-center text-rose-700 text-xs font-medium">
                    <span class="mr-2">⚠️</span> API disconnected. Utilizing offline sample mode for demo.
                </div>

                <form @submit.prevent="executeAnalysis()" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Repository Path</label>
                        <input type="text" x-model="repoPath" required
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-400 font-mono">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Target File</label>
                        <input type="text" x-model="filePath" required
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-400 font-mono">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Target Symbol / Class / Function</label>
                        <input type="text" x-model="symbolName" required
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-400 font-mono">
                    </div>

                    <button type="submit" :disabled="loading"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white font-semibold py-3 rounded-xl text-xs transition shadow-md shadow-indigo-200 flex items-center justify-center space-x-2">
                        <template x-if="!loading">
                            <span>🕵️ Execute AST Analysis</span>
                        </template>
                        <template x-if="loading">
                            <span class="flex items-center space-x-2">
                                <svg class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                </svg>
                                <span>Analyzing Code AST...</span>
                            </span>
                        </template>
                    </button>
                </form>
            </div>

            <!-- Sample Scenarios -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Sample Scenarios</h3>
                <div class="space-y-2">
                    <button @click="loadScenario('get')" 
                            class="w-full text-left p-3.5 rounded-xl bg-slate-50 hover:bg-indigo-50/50 border border-slate-200 transition flex items-center justify-between group">
                        <div>
                            <div class="text-xs font-mono text-slate-900 font-semibold"><span class="text-indigo-600">`get`</span> in requests/api.py</div>
                            <div class="text-[11px] text-slate-500 mt-0.5">Scan active symbol in Requests library</div>
                        </div>
                        <span class="text-[10px] font-semibold px-2.5 py-1 rounded-md bg-rose-100 text-rose-700 border border-rose-200">High Risk</span>
                    </button>

                    <button @click="loadScenario('investigate_symbol')" 
                            class="w-full text-left p-3.5 rounded-xl bg-slate-50 hover:bg-indigo-50/50 border border-slate-200 transition flex items-center justify-between group">
                        <div>
                            <div class="text-xs font-mono text-slate-900 font-semibold"><span class="text-emerald-600">`investigate_symbol`</span></div>
                            <div class="text-[11px] text-slate-500 mt-0.5">Scan this app's backend endpoint</div>
                        </div>
                        <span class="text-[10px] font-semibold px-2.5 py-1 rounded-md bg-emerald-100 text-emerald-700 border border-emerald-200">Active Symbol</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Right Output / Analysis Display Section -->
        <section class="lg:col-span-7 space-y-6">
            
            <!-- Default Initial State -->
            <template x-if="!result && !loading">
                <div class="bg-white border border-slate-200 rounded-2xl p-12 text-center flex flex-col items-center justify-center min-h-[420px] shadow-sm">
                    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-2xl mb-4 border border-indigo-100">
                        🔍
                    </div>
                    <h3 class="text-base font-bold text-slate-900">No Target Analyzed Yet</h3>
                    <p class="text-xs text-slate-500 max-w-sm mt-1">Select a sample scenario from the left panel or click Execute AST Analysis to inspect code paths.</p>
                </div>
            </template>

            <!-- Results Card -->
            <template x-if="result">
                <div class="space-y-6">
                    
                    <!-- Verdict & Score Header -->
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm relative overflow-hidden">
                        <div class="flex items-start justify-between">
                            <div>
                                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Target Symbol Verdict</div>
                                <h2 class="text-2xl font-black mt-1 tracking-tight" 
                                    :class="{
                                        'text-emerald-600': result.verdict.includes('SAFE'),
                                        'text-amber-600': result.verdict.includes('REVIEW'),
                                        'text-rose-600': result.verdict.includes('DO NOT')
                                    }" 
                                    x-text="result.verdict"></h2>
                                <p class="text-xs text-slate-500 mt-1 font-mono">Symbol: <span class="text-indigo-600 font-semibold" x-text="result.symbol"></span></p>
                            </div>
                            
                            <div class="text-right">
                                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Calculated Risk Score</div>
                                <div class="text-3xl font-extrabold text-slate-900 mt-1" x-text="result.risk_score + '/100'"></div>
                            </div>
                        </div>

                        <!-- Action Bar -->
                        <div class="mt-5 pt-4 border-t border-slate-100 flex items-center space-x-3">
                            <button @click="showTestCases = !showTestCases" 
                                    class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl font-medium transition flex items-center space-x-1.5 border border-slate-200">
                                <span>🧪 View Evaluation Test Cases</span>
                                <span class="text-[10px] bg-slate-200 px-1.5 py-0.5 rounded-md text-slate-700 font-bold" x-text="result.test_cases ? result.test_cases.length : 5"></span>
                            </button>

                            <button @click="openTicketModal()" 
                                    class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3.5 py-2 rounded-xl font-medium transition">
                                📩 Request Ownership Rights
                            </button>
                        </div>
                    </div>

                    <!-- Evaluation Matrix Modal / Drawer -->
                    <div x-show="showTestCases" x-transition x-cloak class="bg-white rounded-2xl border border-indigo-200 p-5 shadow-lg">
                        <h4 class="text-xs font-bold text-indigo-700 uppercase tracking-wider mb-3 flex items-center justify-between">
                            <span>Verdict Evaluation Test Cases Matrix</span>
                            <button @click="showTestCases = false" class="text-slate-400 hover:text-slate-600 text-base">&times;</button>
                        </h4>
                        
                        <div class="space-y-2">
                            <template x-for="tc in result.test_cases" :key="tc.id">
                                <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs">
                                    <div class="flex items-center space-x-3">
                                        <span class="font-mono text-slate-400 font-semibold" x-text="tc.id"></span>
                                        <span class="font-medium text-slate-800" x-text="tc.name"></span>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <span class="font-mono text-slate-500" x-text="'+' + tc.risk + ' Risk'"></span>
                                        <span class="px-2.5 py-0.5 rounded-md text-[10px] font-bold"
                                              :class="tc.status === 'TRIGGERED' ? 'bg-rose-100 text-rose-700 border border-rose-200' : 'bg-emerald-100 text-emerald-700 border border-emerald-200'"
                                              x-text="tc.status"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Evidence & Risk Radar Matrix -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        <!-- Evidence List -->
                        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Recorded AST Evidence</h3>
                            <ul class="space-y-2 text-xs text-slate-700">
                                <template x-for="item in result.evidence" :key="item">
                                    <li class="flex items-start space-x-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                        <span class="text-indigo-600 font-bold">•</span>
                                        <span x-text="item"></span>
                                    </li>
                                </template>
                            </ul>
                        </div>

                        <!-- Radar Chart Canvas -->
                        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col items-center justify-center">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 w-full text-left">Risk Vector Diagram</h3>
                            <div class="w-full h-48 relative">
                                <canvas id="riskRadarChart"></canvas>
                            </div>
                        </div>

                    </div>

                </div>
            </template>

        </section>

    </main>

    <!-- Ownership Ticket Request Modal -->
    <div x-show="showTicketModal" x-cloak class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 shadow-xl" @click.away="showTicketModal = false">
            <h3 class="text-base font-bold text-slate-900 mb-1">Request Code Ownership Rights</h3>
            <p class="text-xs text-slate-500 mb-4">Generate an auditable ownership request ticket to the registered maintainer.</p>

            <form @submit.prevent="submitTicket()" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Target Symbol</label>
                    <input type="text" :value="result ? result.symbol : ''" readonly class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-500 font-mono">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Reason for Rights Transfer</label>
                    <textarea x-model="ticketReason" required rows="3" placeholder="e.g. Refactoring dead code path identified during sprint cleanup..."
                              class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" @click="showTicketModal = false" class="px-3.5 py-2 text-xs bg-slate-100 text-slate-700 rounded-xl font-medium hover:bg-slate-200 border border-slate-200">Cancel</button>
                    <button type="submit" class="px-3.5 py-2 text-xs bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 shadow-sm">Generate Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Alpine App State Logic -->
    <script>
        function appData() {
            return {
                repoPath: 'C:/Users/SHRUTI MISHRA/requests',
                filePath: 'src/requests/api.py',
                symbolName: 'get',
                loading: false,
                apiConnected: false,
                result: null,
                showTestCases: false,
                showTicketModal: false,
                ticketReason: '',
                radarChart: null,

                async initApp() {
                    try {
                        const res = await fetch('https://neuranova-ch5z.onrender.com', { method: 'HEAD', mode: 'no-cors' });
                        this.apiConnected = true;
                    } catch (e) {
                        this.apiConnected = false;
                    }
                },

                loadScenario(type) {
                    if (type === 'get') {
                        this.repoPath = 'C:/Users/SHRUTI MISHRA/requests';
                        this.filePath = 'src/requests/api.py';
                        this.symbolName = 'get';
                    } else if (type === 'investigate_symbol') {
                        this.repoPath = 'C:/Users/SHRUTI MISHRA/NeuraNova';
                        this.filePath = 'main.py';
                        this.symbolName = 'investigate_symbol';
                    }
                    this.executeAnalysis();
                },

                async executeAnalysis() {
                    this.loading = true;
                    this.showTestCases = false;

                    try {
                        const response = await fetch('https://neuranova-ch5z.onrender.com', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                repo_path: this.repoPath,
                                file_path: this.filePath,
                                symbol_name: this.symbolName
                            })
                        });

                        if (!response.ok) throw new Error('Backend Offline');
                        
                        const data = await response.json();
                        this.apiConnected = true;
                        this.renderData(data);

                    } catch (err) {
                        this.apiConnected = false;
                        
                        setTimeout(() => {
                            let mockData;
                            if (this.symbolName === 'get') {
                                mockData = {
                                    symbol: "get",
                                    verdict: "🔴 DO NOT DELETE",
                                    risk_score: 85,
                                    evidence: [
                                        "Referenced in 3 external modules (+50 risk)",
                                        "Covered in 2 automated test suites (+35 risk)",
                                        "Defined in global exported API scope"
                                    ],
                                    test_cases: [
                                        { id: "TC-01", name: "Symbol Definition Check", status: "PASSED", risk: 0 },
                                        { id: "TC-02", name: "External Module Imports", status: "TRIGGERED", risk: 50 },
                                        { id: "TC-03", name: "Regression Test Coverage", status: "TRIGGERED", risk: 35 },
                                        { id: "TC-04", name: "Git Ownership Provenance", status: "PASSED", risk: 0 },
                                        { id: "TC-05", name: "Final Risk Assessment", status: "TRIGGERED", risk: 85 }
                                    ],
                                    radar_vectors: [85, 90, 70, 60, 80]
                                };
                            } else {
                                mockData = {
                                    symbol: this.symbolName || "investigate_symbol",
                                    verdict: "🟢 SAFE TO DELETE",
                                    risk_score: 10,
                                    evidence: [
                                        "No external module usages identified across codebase",
                                        "Zero unit test suite dependencies recorded",
                                        "Local scope isolation confirmed"
                                    ],
                                    test_cases: [
                                        { id: "TC-01", name: "Symbol Definition Check", status: "PASSED", risk: 0 },
                                        { id: "TC-02", name: "External Module Imports", status: "PASSED", risk: 0 },
                                        { id: "TC-03", name: "Regression Test Coverage", status: "PASSED", risk: 0 },
                                        { id: "TC-04", name: "Git Ownership Provenance", status: "PASSED", risk: 10 },
                                        { id: "TC-05", name: "Final Risk Assessment", status: "PASSED", risk: 10 }
                                    ],
                                    radar_vectors: [10, 5, 0, 15, 10]
                                };
                            }
                            this.renderData(mockData);
                        }, 400);
                    } finally {
                        setTimeout(() => { this.loading = false; }, 400);
                    }
                },

                renderData(data) {
                    this.result = data;
                    this.$nextTick(() => {
                        this.initChart(data.radar_vectors || [70, 60, 80, 50, 90]);
                    });
                },

                initChart(vectors) {
                    const ctx = document.getElementById('riskRadarChart');
                    if (!ctx) return;

                    if (this.radarChart) {
                        this.radarChart.destroy();
                    }

                    this.radarChart = new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: ['Scope', 'Imports', 'Tests', 'Git', 'Complexity'],
                            datasets: [{
                                label: 'Risk Metrics',
                                data: vectors,
                                backgroundColor: 'rgba(99, 102, 241, 0.15)',
                                borderColor: 'rgba(99, 102, 241, 1)',
                                borderWidth: 2,
                                pointBackgroundColor: 'rgba(99, 102, 241, 1)'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                r: {
                                    angleLines: { color: 'rgba(226, 232, 240, 1)' },
                                    grid: { color: 'rgba(226, 232, 240, 1)' },
                                    pointLabels: { color: '#64748b', font: { size: 10, weight: 'bold' } },
                                    ticks: { display: false, backdropColor: 'transparent' },
                                    suggestedMin: 0,
                                    suggestedMax: 100
                                }
                            }
                        }
                    });
                },

                resetWorkspace() {
                    this.repoPath = '';
                    this.filePath = '';
                    this.symbolName = '';
                    this.result = null;
                },

                openTicketModal() {
                    this.showTicketModal = true;
                },

                submitTicket() {
                    const ticketId = 'TK-' + Math.floor(10000 + Math.random() * 90000);
                    alert(`✅ Ownership Request Ticket Created: ${ticketId}\n\nRouted to code author with reason: "${this.ticketReason}"`);
                    this.showTicketModal = false;
                    this.ticketReason = '';
                }
            };
        }
    </script>
</body>
</html>
